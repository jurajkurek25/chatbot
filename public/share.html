<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Zdieľané súbory</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --p: #5b4fff; --p-light: rgba(91,79,255,0.09);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --text: #1e293b; --muted: #64748b; --border: #e2e8f0;
      --bg: #f1f5f9; --card: #ffffff; --radius: 16px; --btn-radius: 10px;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
    .page { max-width: 820px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    .owner { font-size: .85rem; font-weight: 700; color: var(--p); margin-bottom: 1rem; }
    .card { background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 20px rgba(0,0,0,.06); padding: 1.5rem; margin-bottom: 1.25rem; }
    h1 { font-size: 1.35rem; font-weight: 800; margin-bottom: .3rem; word-break: break-word; }
    .muted { color: var(--muted); font-size: .85rem; }
    .crumbs { font-size: .88rem; margin-bottom: .75rem; }
    .crumbs a { color: var(--p); text-decoration: none; font-weight: 600; }
    .list { list-style: none; }
    .list li { display: flex; align-items: center; gap: .75rem; padding: .6rem 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
    .list li:last-child { border-bottom: none; }
    .list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list a.name { color: var(--text); text-decoration: none; font-weight: 600; }
    .btn { display: inline-block; padding: .55rem 1rem; border-radius: var(--btn-radius); border: none; background: var(--p); color: #fff; font-size: .85rem; font-weight: 700; cursor: pointer; font-family: inherit; text-decoration: none; }
    .btn.s { background: var(--bg); color: var(--text); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    input[type=password] { width: 100%; padding: .7rem .9rem; border: 1.5px solid var(--border); border-radius: 9px; font-size: .95rem; font-family: inherit; margin: .8rem 0; }
    .drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 1.5rem; text-align: center; color: var(--muted); font-size: .9rem; transition: background .15s, border-color .15s; }
    .drop.over { background: var(--p-light); border-color: var(--p); }
    .msg { padding: .8rem 1rem; border-radius: 10px; font-size: .88rem; font-weight: 600; margin-bottom: 1rem; }
    .msg.ok { background: #dcfce7; color: #15803d; }
    .msg.err { background: #fee2e2; color: #b91c1c; }
    .preview { margin-top: 1rem; }
    .preview img, .preview video { max-width: 100%; border-radius: 10px; display: block; }
    .preview iframe { width: 100%; height: 70vh; border: 0; border-radius: 10px; }
    .foot { text-align: center; margin-top: 1.5rem; font-size: .78rem; color: var(--muted); }
    .foot a { color: inherit; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
<div class="page" id="app"><div class="card"><p class="muted">Načítavam...</p></div></div>
<script>
(function () {
  'use strict';
  const token = location.pathname.split('/').filter(Boolean).pop();
  const API = `/api/drive/public/${encodeURIComponent(token)}`;
  const KEY = `nw_share_${token}`;
  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const size = b => b > 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1024))} kB`;
  const app = document.getElementById('app');
  let info = null, parent = null, flash = '';

  const key = { get() { try { return sessionStorage.getItem(KEY) || ''; } catch { return ''; } }, set(v) { try { sessionStorage.setItem(KEY, v); } catch {} } };
  async function api(path, opts = {}) {
    const r = await fetch(API + path, { ...opts, headers: { 'X-Share-Key': key.get(), ...(opts.body && !(opts.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {}) } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(d.error || 'Chyba.'), { status: r.status, locked: d.locked });
    return d;
  }
  const icon = i => i.kind === 'folder' ? '📁' : /^image\//.test(i.mime) ? '🖼' : /^video\//.test(i.mime) ? '🎬' : i.mime === 'application/pdf' ? '📕' : '📄';
  const canPreview = m => /^(image\/(png|jpeg|gif|webp)|application\/pdf|video\/(mp4|webm)|audio\/|text\/plain)/.test(m || '');
  const shell = inner => `<div class="owner">${esc(info.owner.name)}</div>${flash}${inner}
    ${info.expiresAt ? `<p class="foot">Odkaz platí do ${new Date(info.expiresAt * 1000).toLocaleDateString('sk-SK')}</p>` : ''}
    <p class="foot">Zdieľané cez <a href="/" target="_blank" rel="noopener">Neoworkly Disk</a></p>`;

  async function fileUrl(id, inline) {
    return (await api(`/file/${encodeURIComponent(id)}${inline ? '?inline=1' : ''}`)).url;
  }

  function showLocked(err) {
    app.innerHTML = shell(`<div class="card" style="max-width:420px;margin:2rem auto"><h1>🔒 ${esc(info.name)}</h1>
      <p class="muted">Tento odkaz je chránený heslom.</p>
      <form id="unlock"><input type="password" id="pw" required autocomplete="current-password" placeholder="Heslo" autofocus>
      ${err ? `<div class="msg err">${esc(err)}</div>` : ''}<button class="btn" type="submit" style="width:100%">Otvoriť</button></form></div>`);
    document.getElementById('unlock').onsubmit = async e => {
      e.preventDefault();
      try {
        key.set((await api('/unlock', { method: 'POST', body: JSON.stringify({ password: document.getElementById('pw').value }) })).key || '');
        start();
      } catch (er) { showLocked(er.message); }
    };
  }

  async function showFile(f) {
    const url = canPreview(f.mime) ? await fileUrl(f.id, true) : null;
    const m = f.mime || '';
    const view = !url ? '' : m.startsWith('image/') ? `<img src="${esc(url)}" alt="">` : m.startsWith('video/') ? `<video src="${esc(url)}" controls></video>`
      : m.startsWith('audio/') ? `<audio src="${esc(url)}" controls style="width:100%"></audio>` : `<iframe src="${esc(url)}" sandbox=""></iframe>`;
    app.innerHTML = shell(`<div class="card"><h1>${icon(f)} ${esc(f.name)}</h1><p class="muted">${size(f.size)}</p>
      <p style="margin-top:1rem"><button class="btn" id="dl">⬇ Stiahnuť</button></p><div class="preview">${view}</div></div>`);
    document.getElementById('dl').onclick = async () => { location.href = await fileUrl(f.id); };
  }

  async function showFolder() {
    const d = await api(`/items${parent ? `?parent=${encodeURIComponent(parent)}` : ''}`);
    app.innerHTML = shell(`<div class="card">
      <div class="crumbs">${d.path.map((p, i) => i === d.path.length - 1 ? `<b>${esc(p.name)}</b>` : `<a href="#" data-to="${esc(p.id)}">${esc(p.name)}</a>`).join(' / ')}</div>
      ${d.items.length ? `<ul class="list">${d.items.map(i => `<li><span>${icon(i)}</span>
        ${i.kind === 'folder' ? `<a href="#" class="name" data-to="${esc(i.id)}">${esc(i.name)}</a>` : `<a href="#" class="name" data-view="${esc(i.id)}">${esc(i.name)}</a><span class="muted">${size(i.size)}</span>
          <button class="btn s" data-dl="${esc(i.id)}">⬇</button>`}</li>`).join('')}</ul>` : '<p class="muted">Priečinok je prázdny.</p>'}
    </div>
    ${info.allowUpload ? `<div class="drop" id="drop">Pretiahnite sem súbory alebo <label style="color:var(--p);font-weight:700;cursor:pointer">vyberte<input type="file" id="up" multiple hidden></label> – nahrajú sa do priečinka <b>${esc(d.folder.name)}</b>.</div>` : ''}`);
    flash = '';
    app.querySelectorAll('[data-to]').forEach(a => { a.onclick = e => { e.preventDefault(); parent = a.dataset.to; showFolder().catch(fail); }; });
    app.querySelectorAll('[data-dl]').forEach(b => { b.onclick = async () => { location.href = await fileUrl(b.dataset.dl); }; });
    app.querySelectorAll('[data-view]').forEach(a => {
      a.onclick = async e => {
        e.preventDefault();
        const it = d.items.find(i => i.id === a.dataset.view);
        if (canPreview(it.mime)) window.open(await fileUrl(it.id, true), '_blank', 'noopener'); else location.href = await fileUrl(it.id);
      };
    });
    if (!info.allowUpload) return;
    const drop = document.getElementById('drop');
    const send = async files => {
      if (!files.length) return;
      const fd = new FormData();
      for (const f of files) fd.append('files', f);
      drop.textContent = `Nahrávam ${files.length}…`;
      try {
        await api(`/upload?parent=${encodeURIComponent(d.folder.id)}`, { method: 'POST', body: fd });
        flash = `<div class="msg ok">Hotovo ✓ Nahraté: ${files.length}.</div>`;
      } catch (er) { flash = `<div class="msg err">${esc(er.message)}</div>`; }
      showFolder().catch(fail);
    };
    document.getElementById('up').onchange = e => send(e.target.files);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); send(e.dataTransfer.files); };
  }

  function fail(err) {
    if (err.locked) return showLocked();
    app.innerHTML = `<div class="card"><p class="muted">${esc(err.message)}</p></div>`;
  }

  async function start() {
    try {
      info = await api('');
    } catch (err) {
      app.innerHTML = '<div class="card" style="max-width:460px;margin:3rem auto;text-align:center"><h1>Odkaz neplatí</h1><p class="muted">Odkaz neexistuje, vypršal alebo ho majiteľ zrušil.</p></div>';
      return;
    }
    document.title = `${info.name} – ${info.owner.name}`;
    if (/^#[0-9a-f]{6}$/i.test(info.owner.color || '')) {
      const c = info.owner.color;
      document.documentElement.style.setProperty('--p', c);
      document.documentElement.style.setProperty('--p-light', `rgba(${parseInt(c.slice(1, 3), 16)},${parseInt(c.slice(3, 5), 16)},${parseInt(c.slice(5, 7), 16)},.1)`);
    }
    if (info.locked) return showLocked();
    (info.kind === 'file' ? showFile(info.file) : showFolder()).catch(fail);
  }
  start();
})();
</script>
</body>
</html>
