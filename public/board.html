<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Tabuľa – Neoworkly</title>
  <link rel="stylesheet" href="/apps/board/board-editor.css?v=1">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0d0d18; color: #eeeef5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { display: flex; flex-direction: column; }
    .bar { display: flex; gap: .6rem; align-items: center; padding: .5rem 1rem; background: #080810; border-bottom: 1px solid rgba(255,255,255,.08); }
    .bar a.back { color: #9b8cff; text-decoration: none; font-weight: 700; font-size: .9rem; white-space: nowrap; }
    .bar input { flex: 1; min-width: 0; background: transparent; border: 1px solid transparent; border-radius: 8px; color: #eeeef5; font: inherit; font-size: 1.05rem; font-weight: 700; padding: .35rem .5rem; }
    .bar input:hover:not(:disabled), .bar input:focus { border-color: rgba(255,255,255,.14); outline: none; }
    .btn { background: #111120; color: #eeeef5; border: 1px solid rgba(255,255,255,.08); border-radius: 8px; padding: .4rem .75rem; font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn:hover { border-color: rgba(155,140,255,.5); }
    .people { display: flex; gap: 2px; }
    .people span { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: .7rem; font-weight: 700; border: 2px solid #080810; }
    .status { font-size: .75rem; color: #7e7ea0; white-space: nowrap; }
    #board { flex: 1; min-height: 0; position: relative; }
    .msg { max-width: 520px; margin: 4rem auto; text-align: center; color: #9898b8; }
    #toast { display: none; position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); background: #18182a; border: 1px solid rgba(155,140,255,.4); color: #eeeef5; padding: .6rem 1rem; border-radius: 10px; font-size: .86rem; z-index: 50; }
    /* Excalidraw v dizajne Neoworkly */
    .excalidraw.theme--dark { --color-primary: #5b4fff; --color-primary-darker: #4a3fe0; --color-primary-darkest: #3a30c0; --color-primary-light: #9b8cff; --island-bg-color: #18182a; --default-bg-color: #0d0d18; --color-surface-high: #24243a; --color-surface-mid: #18182a; --color-surface-low: #111120; --color-surface-lowest: #0d0d18; }
    @media (max-width: 640px) { .status { display: none; } }
  </style>
</head>
<body>
  <div class="bar">
    <a class="back" href="/dashboard?view=boards">← Tabule</a>
    <input id="title" placeholder="Tabuľa" maxlength="200" disabled>
    <span class="status" id="status">Pripájam…</span>
    <span class="people" id="people"></span>
    <button class="btn" id="toDrive" title="Uloží obrázok tabule (PNG) na Disk – môžete ho poslať v chate alebo priložiť k úlohe">💾 PNG na Disk</button>
  </div>
  <div id="board"><p class="msg">Načítavam tabuľu…</p></div>
  <div id="toast"></div>
  <script type="module" src="/apps/board/board-editor.js?v=1"></script>
</body>
</html>
