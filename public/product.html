<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produkt</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --p: #5b4fff; --p-light: rgba(91,79,255,0.09);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --text: #1e293b; --muted: #64748b; --border: #e2e8f0;
      --bg: #f1f5f9; --card: #ffffff; --radius: 16px; --btn-radius: 10px;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
    .page { max-width: 1040px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    .store { font-size: .85rem; font-weight: 700; color: var(--muted); margin-bottom: 1rem; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 1.5rem; align-items: start; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .buy { position: static !important; } }
    .card { background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 20px rgba(0,0,0,.06); padding: 1.5rem; margin-bottom: 1.25rem; }
    .cover { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: var(--radius); margin-bottom: 1.25rem; display: block; background: var(--border); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: .75rem; font-weight: 700; background: var(--p-light); color: var(--p); margin-bottom: .6rem; }
    h1 { font-size: 1.75rem; font-weight: 800; line-height: 1.25; margin-bottom: .4rem; }
    .subtitle { font-size: 1.05rem; color: var(--muted); }
    .desc { white-space: pre-line; font-size: .95rem; }
    h2 { font-size: 1rem; font-weight: 800; margin-bottom: .8rem; }
    .list { list-style: none; }
    .list li { display: flex; justify-content: space-between; gap: 1rem; padding: .55rem 0; border-bottom: 1px solid var(--border); font-size: .9rem; }
    .list li:last-child { border-bottom: none; }
    .module { margin-bottom: 1rem; }
    .module-title { font-weight: 700; font-size: .92rem; margin-bottom: .3rem; }
    .lesson { border-bottom: 1px solid var(--border); font-size: .88rem; }
    .lesson:last-child { border-bottom: none; }
    .lesson summary, .lesson .row { display: flex; justify-content: space-between; gap: .75rem; padding: .5rem 0; cursor: default; list-style: none; }
    .lesson summary { cursor: pointer; color: var(--p); font-weight: 600; }
    .lesson summary::-webkit-details-marker { display: none; }
    .lesson .lock { color: var(--muted); }
    .preview { padding: .25rem 0 1rem; white-space: pre-line; }
    .video { position: relative; width: 100%; aspect-ratio: 16 / 9; margin-bottom: .75rem; }
    .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 10px; }
    .buy { position: sticky; top: 1rem; }
    .price { font-size: 2rem; font-weight: 800; margin-bottom: .25rem; }
    .muted { color: var(--muted); font-size: .85rem; }
    label.field { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin: .9rem 0 .3rem; }
    input[type=text], input[type=email] { width: 100%; padding: .7rem .9rem; border: 1.5px solid var(--border); border-radius: 9px; font-size: .95rem; font-family: inherit; color: var(--text); }
    input:focus { outline: none; border-color: var(--p); }
    .check { display: flex; gap: .55rem; align-items: flex-start; font-size: .8rem; color: var(--muted); margin-top: .8rem; line-height: 1.45; }
    .check input { margin-top: .15rem; accent-color: var(--p); flex-shrink: 0; }
    .btn { width: 100%; margin-top: 1.1rem; padding: .9rem 1rem; border-radius: var(--btn-radius); border: none; background: var(--p); color: #fff; font-size: 1rem; font-weight: 800; cursor: pointer; font-family: inherit; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .msg { padding: .8rem 1rem; border-radius: 10px; font-size: .88rem; font-weight: 600; margin-top: 1rem; }
    .msg.ok { background: #dcfce7; color: #15803d; }
    .msg.err { background: #fee2e2; color: #b91c1c; }
    .foot { text-align: center; margin-top: 1rem; font-size: .8rem; }
    .foot a { color: var(--p); font-weight: 600; }
    .hidden { display: none !important; }
  </style>
  <style id="custom-css"></style>
</head>
<body>
<div class="page" id="app"><div class="card"><p class="muted">Načítavam...</p></div></div>
<script>
(function () {
  'use strict';
  const id = location.pathname.split('/').filter(Boolean).pop();
  const API = `/api/shop/public/${encodeURIComponent(id)}`;
  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const money = (v, cur) => Number(v).toLocaleString('sk-SK', { style: 'currency', currency: cur || 'EUR' });
  const size = b => b > 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1024))} kB`;
  const TYPE = { file: 'Na stiahnutie', course: 'Online kurz', membership: 'Členstvo' };
  // Embed adresy prichádzajú zo servera (iba overení poskytovatelia videa)
  const video = url => url ? `<div class="video"><iframe src="${esc(url)}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>` : '';
  const app = document.getElementById('app');

  function theme(color, css) {
    if (/^#[0-9a-f]{6}$/i.test(color || '')) {
      document.documentElement.style.setProperty('--p', color);
      document.documentElement.style.setProperty('--p-light', `rgba(${parseInt(color.slice(1, 3), 16)},${parseInt(color.slice(3, 5), 16)},${parseInt(color.slice(5, 7), 16)},.1)`);
    }
    document.getElementById('custom-css').textContent = css || '';
  }

  function curriculum(p) {
    if (!p.curriculum.length) return '';
    const lessons = p.curriculum.reduce((n, m) => n + m.lessons.length, 0);
    return `<div class="card"><h2>Obsah kurzu · ${lessons} ${lessons === 1 ? 'lekcia' : lessons < 5 ? 'lekcie' : 'lekcií'}</h2>
      ${p.curriculum.map(m => `<div class="module"><div class="module-title">${esc(m.title)}</div>
        ${m.lessons.map(l => l.preview
          ? `<details class="lesson"><summary><span>▶ ${esc(l.title)}</span><span>Ukážka zadarmo</span></summary>
              <div class="preview">${video(l.embed)}${l.videoUrl ? `<p><a href="${esc(l.videoUrl)}" target="_blank" rel="noopener">Pozrieť video</a></p>` : ''}${esc(l.content)}</div></details>`
          : `<div class="lesson"><div class="row"><span>${l.hasVideo ? '🎬' : '📄'} ${esc(l.title)}</span><span class="lock">🔒</span></div></div>`).join('')}
      </div>`).join('')}</div>`;
  }

  function render(p) {
    document.title = `${p.title} – ${p.store.name}`;
    theme(p.store.color, p.store.customCss);
    const cancelled = new URLSearchParams(location.search).get('payment') === 'cancelled';
    app.innerHTML = `
      <div class="store">${esc(p.store.name)}</div>
      <div class="layout">
        <main>
          ${p.coverUrl ? `<img class="cover" src="${esc(p.coverUrl)}" alt="">` : ''}
          <div class="card">
            <span class="badge">${TYPE[p.type] || ''}</span>
            <h1>${esc(p.title)}</h1>
            ${p.subtitle ? `<p class="subtitle">${esc(p.subtitle)}</p>` : ''}
          </div>
          ${p.description ? `<div class="card"><div class="desc">${esc(p.description)}</div></div>` : ''}
          ${p.files.length ? `<div class="card"><h2>Čo dostanete</h2><ul class="list">${p.files.map(f => `<li><span>📎 ${esc(f.original_name)}</span><span class="muted">${size(f.size)}</span></li>`).join('')}</ul></div>` : ''}
          ${p.includes.length ? `<div class="card"><h2>Členstvo obsahuje</h2><ul class="list">${p.includes.map(i => `<li><span>${esc(i.title)}</span><span class="muted">${TYPE[i.type] || ''}</span></li>`).join('')}</ul></div>` : ''}
          ${curriculum(p)}
        </main>
        <aside class="card buy">
          <div class="price">${p.free ? 'Zadarmo' : money(p.price, p.currency)}</div>
          <p class="muted">${p.accessDays ? `Prístup na ${p.accessDays} dní` : 'Prístup bez časového obmedzenia'}${p.free ? '' : ' · platba kartou cez Stripe'}</p>
          ${cancelled ? '<div class="msg err">Platba bola zrušená. Môžete to skúsiť znova.</div>' : ''}
          ${p.purchasable ? `
          <form id="buy">
            <label class="field" for="b-name">Meno</label>
            <input type="text" id="b-name" autocomplete="name" maxlength="120">
            <label class="field" for="b-email">E-mail *</label>
            <input type="email" id="b-email" autocomplete="email" required maxlength="200">
            <label class="check"><input type="checkbox" id="b-consent" required>
              <span>Súhlasím so spracovaním osobných údajov na vybavenie objednávky predajcom ${esc(p.store.name)}.</span></label>
            ${p.free ? '' : `<label class="check"><input type="checkbox" id="b-waiver" required>
              <span>Žiadam o sprístupnenie obsahu ihneď po zaplatení a beriem na vedomie, že tým strácam právo odstúpiť od zmluvy do 14 dní.</span></label>`}
            <button class="btn" type="submit">${p.free ? 'Získať zadarmo' : `Kúpiť za ${money(p.price, p.currency)}`}</button>
            <div id="buy-msg"></div>
          </form>` : '<div class="msg err">Predajca zatiaľ neprijíma platby online.</div>'}
          <p class="foot">Už máte prístup? <a href="/members/${encodeURIComponent(p.storeId)}">Členská sekcia</a></p>
          ${p.store.supportEmail ? `<p class="foot muted">Otázky: <a href="mailto:${esc(p.store.supportEmail)}">${esc(p.store.supportEmail)}</a></p>` : ''}
        </aside>
      </div>`;
    const form = document.getElementById('buy');
    if (form) form.addEventListener('submit', e => buy(e, p));
  }

  async function buy(e, p) {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    const msg = document.getElementById('buy-msg');
    msg.innerHTML = '';
    btn.disabled = true;
    try {
      const r = await fetch(`${API}/checkout`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('b-name').value, email: document.getElementById('b-email').value,
          consent: document.getElementById('b-consent').checked, waiver: !p.free && document.getElementById('b-waiver').checked,
        }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Objednávka zlyhala.');
      if (d.checkoutUrl) { location.href = d.checkoutUrl; return; }
      e.target.innerHTML = '<div class="msg ok">Hotovo ✓ Prístup sme vám poslali e-mailom. Skontrolujte aj priečinok spam.</div>';
    } catch (err) {
      msg.innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
      btn.disabled = false;
    }
  }

  fetch(API).then(async r => {
    if (!r.ok) { app.innerHTML = '<div class="card"><p class="muted">Produkt nie je dostupný.</p></div>'; return; }
    render(await r.json());
  }).catch(() => { app.innerHTML = '<div class="card"><p class="muted">Stránku sa nepodarilo načítať. Skúste to znova.</p></div>'; });
})();
</script>
</body>
</html>
