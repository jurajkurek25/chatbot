<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezervácia termínu</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --primary: #2563eb; --primary-light: #eff6ff; --radius: 12px; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: #f8fafc; color: #1e293b; min-height: 100vh; }

    .page { max-width: 680px; margin: 0 auto; padding: 2rem 1rem 4rem; }

    .card { background: white; border-radius: var(--radius); box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            padding: 2rem; margin-bottom: 1.5rem; }

    .header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .header-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex;
                     align-items: center; justify-content: center; font-size: 1.4rem;
                     color: white; flex-shrink: 0; }
    .header h1 { font-size: 1.25rem; font-weight: 700; }
    .header p  { font-size: 0.85rem; color: #64748b; margin-top: 0.15rem; }

    /* Steps */
    .steps { display: flex; gap: 0; margin-bottom: 2rem; }
    .step { flex: 1; text-align: center; font-size: 0.75rem; font-weight: 600; color: #94a3b8;
            padding: 0.5rem 0.25rem; border-bottom: 2px solid #e2e8f0; position: relative; }
    .step.active   { color: var(--primary); border-bottom-color: var(--primary); }
    .step.done     { color: #22c55e; border-bottom-color: #22c55e; }

    /* Step panels */
    .step-panel { display: none; }
    .step-panel.active { display: block; }

    /* Calendar */
    .cal-header { display: flex; align-items: center; justify-content: space-between;
                  margin-bottom: 1rem; }
    .cal-header h2 { font-size: 1rem; font-weight: 700; }
    .cal-nav { background: none; border: 1px solid #e2e8f0; border-radius: 8px;
               padding: 0.4rem 0.7rem; cursor: pointer; font-size: 0.9rem; color: #374151; }
    .cal-nav:hover { background: #f1f5f9; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-day-name { text-align: center; font-size: 0.7rem; font-weight: 600; color: #94a3b8;
                    padding: 0.3rem 0; }
    .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
               border-radius: 8px; font-size: 0.85rem; cursor: pointer; border: none;
               background: none; font-family: inherit; transition: background 0.15s, color 0.15s; }
    .cal-day:disabled { color: #cbd5e1; cursor: not-allowed; }
    .cal-day:not(:disabled):not(.empty):hover { background: var(--primary-light); color: var(--primary); }
    .cal-day.selected { background: var(--primary); color: white !important; font-weight: 700; }
    .cal-day.today { font-weight: 700; }
    .cal-day.empty { cursor: default; }
    .cal-day.has-slots::after { content: ''; display: block; width: 4px; height: 4px;
                                 background: var(--primary); border-radius: 50%; margin: 1px auto 0; }

    /* Slots */
    .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-top: 1rem; }
    .slot-btn { padding: 0.6rem; border: 1.5px solid #e2e8f0; border-radius: 8px; background: white;
                font-size: 0.875rem; font-weight: 600; cursor: pointer; font-family: inherit;
                color: #374151; transition: border-color 0.15s, background 0.15s; }
    .slot-btn:hover { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
    .slot-btn.selected { border-color: var(--primary); background: var(--primary); color: white; }
    .no-slots { color: #94a3b8; font-size: 0.875rem; padding: 1.5rem 0; text-align: center; }

    /* Form */
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #374151;
                        margin-bottom: 0.35rem; }
    .form-group input { width: 100%; padding: 0.6rem 0.85rem; border: 1.5px solid #d1d5db;
                        border-radius: 8px; font-size: 0.9rem; outline: none; font-family: inherit;
                        color: #1e293b; transition: border-color 0.2s; }
    .form-group input:focus { border-color: var(--primary); }
    .form-group input.error { border-color: #dc2626; }
    .gdpr-row { display: flex; align-items: flex-start; gap: 0.6rem; margin-top: 0.5rem; }
    .gdpr-row input[type=checkbox] { margin-top: 3px; width: 16px; height: 16px; flex-shrink: 0; }
    .gdpr-row label { font-size: 0.78rem; color: #475569; font-weight: 400; }

    /* Summary */
    .summary-box { background: var(--primary-light); border-radius: 10px; padding: 1rem 1.25rem;
                   margin-bottom: 1.5rem; }
    .summary-box .row { display: flex; justify-content: space-between; font-size: 0.875rem;
                        padding: 0.25rem 0; }
    .summary-box .row span:first-child { color: #64748b; }
    .summary-box .row span:last-child  { font-weight: 600; }

    /* Buttons */
    .btn { display: inline-block; padding: 0.75rem 1.5rem; border-radius: 8px; border: none;
           font-size: 0.9rem; font-weight: 700; cursor: pointer; font-family: inherit;
           transition: opacity 0.2s; }
    .btn:hover { opacity: 0.88; }
    .btn-primary { background: var(--primary); color: white; width: 100%; text-align: center; }
    .btn-secondary { background: #f1f5f9; color: #374151; }
    .btn-row { display: flex; gap: 0.75rem; margin-top: 1.25rem; }
    .btn-row .btn-secondary { flex: 0 0 auto; }
    .btn-row .btn-primary { flex: 1; }

    /* Success */
    .success-screen { text-align: center; padding: 2rem 0; }
    .success-icon { font-size: 3rem; margin-bottom: 1rem; }
    .success-screen h2 { font-size: 1.25rem; font-weight: 700; color: #15803d; margin-bottom: 0.5rem; }
    .success-screen p { color: #64748b; font-size: 0.9rem; line-height: 1.6; }

    /* Loading */
    .loading { text-align: center; padding: 3rem 0; color: #94a3b8; font-size: 0.9rem; }
    .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #e2e8f0;
               border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) { .page { padding: 1rem 0.75rem 3rem; } .card { padding: 1.25rem; } }
  </style>
</head>
<body>
<div class="page" id="app">
  <div class="loading"><div class="spinner"></div><br>Načítavam...</div>
</div>

<script>
(function () {
  'use strict';

  const widgetId = location.pathname.split('/').filter(Boolean).pop();
  const BASE = location.origin;
  let config = null;
  let selectedDate = null;
  let selectedSlot = null;
  let slots = {};  // date -> [{start_time, end_time}]

  const DAY_NAMES_SK = ['Ne', 'Po', 'Ut', 'St', 'Št', 'Pi', 'So'];
  const DAY_NAMES_EN = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
  const MONTH_NAMES_SK = ['Január','Február','Marec','Apríl','Máj','Jún',
                          'Júl','August','September','Október','November','December'];

  let calYear, calMonth;

  /* ── Init ── */
  async function init() {
    try {
      const r = await fetch(`${BASE}/api/booking/${widgetId}/public/config`);
      if (!r.ok) { showError('Rezervácie nie sú pre túto stránku k dispozícii.'); return; }
      config = await r.json();
      document.title = `Rezervácia – ${config.botName}`;
      document.documentElement.style.setProperty('--primary', config.primaryColor || '#2563eb');
      const light = hexToLight(config.primaryColor || '#2563eb');
      document.documentElement.style.setProperty('--primary-light', light);
      const now = new Date();
      calYear  = now.getFullYear();
      calMonth = now.getMonth();
      renderApp();
    } catch { showError('Chyba pri načítaní.'); }
  }

  function hexToLight(hex) {
    try {
      const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},0.08)`;
    } catch { return '#eff6ff'; }
  }

  /* ── Render ── */
  function renderApp() {
    document.getElementById('app').innerHTML = `
      <div class="card">
        <div class="header">
          <div class="header-avatar" style="background:${config.primaryColor||'#2563eb'}">📅</div>
          <div>
            <h1>${esc(config.botName)}</h1>
            <p>Vyberte si termín online</p>
          </div>
        </div>
        <div class="steps">
          <div class="step active" id="step-1">1. Dátum</div>
          <div class="step" id="step-2">2. Čas</div>
          <div class="step" id="step-3">3. Kontakt</div>
        </div>

        <div class="step-panel active" id="panel-1">
          <div class="cal-header">
            <button class="cal-nav" id="btn-prev">‹</button>
            <h2 id="cal-title"></h2>
            <button class="cal-nav" id="btn-next">›</button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>

        <div class="step-panel" id="panel-2">
          <p style="font-size:0.85rem;color:#64748b;margin-bottom:0.5rem" id="slots-date-label"></p>
          <div class="slots-grid" id="slots-grid"></div>
          <div class="btn-row">
            <button class="btn btn-secondary" onclick="goStep(1)">← Späť</button>
            <button class="btn btn-primary" id="btn-to-step3" disabled onclick="goStep(3)">Pokračovať →</button>
          </div>
        </div>

        <div class="step-panel" id="panel-3">
          <div class="summary-box" id="summary-box"></div>
          <div class="form-group">
            <label>Meno a priezvisko *</label>
            <input type="text" id="f-name" placeholder="Ján Novák" autocomplete="name">
          </div>
          <div class="form-group">
            <label>Email *</label>
            <input type="email" id="f-email" placeholder="jan@email.sk" autocomplete="email">
          </div>
          <div class="form-group">
            <label>Telefón</label>
            <input type="tel" id="f-phone" placeholder="+421 900 000 000" autocomplete="tel">
          </div>
          <div class="gdpr-row">
            <input type="checkbox" id="f-gdpr">
            <label for="f-gdpr">Súhlasím so spracovaním osobných údajov za účelom rezervácie termínu.*</label>
          </div>
          <div class="btn-row">
            <button class="btn btn-secondary" onclick="goStep(2)">← Späť</button>
            <button class="btn btn-primary" id="btn-submit" onclick="submitBooking()">Potvrdiť rezerváciu</button>
          </div>
        </div>

        <div class="step-panel" id="panel-success">
          <div class="success-screen">
            <div class="success-icon">✅</div>
            <h2>Rezervácia potvrdená!</h2>
            <p id="success-msg"></p>
          </div>
        </div>
      </div>
    `;

    document.getElementById('btn-prev').onclick = () => { changeMonth(-1); };
    document.getElementById('btn-next').onclick = () => { changeMonth(1); };
    renderCalendar();
  }

  /* ── Calendar ── */
  function renderCalendar() {
    const title = document.getElementById('cal-title');
    const grid  = document.getElementById('cal-grid');
    if (!title || !grid) return;
    title.textContent = `${MONTH_NAMES_SK[calMonth]} ${calYear}`;
    grid.innerHTML = '';

    DAY_NAMES_SK.forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-day-name';
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const todayStr = todayStr_();

    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('button'); el.className = 'cal-day empty'; el.disabled = true;
      grid.appendChild(el);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = `${calYear}-${pad(calMonth+1)}-${pad(d)}`;
      const btn = document.createElement('button');
      btn.className = 'cal-day';
      btn.textContent = d;
      if (ds < todayStr) { btn.disabled = true; }
      else if (!isAvailableDay(ds)) { btn.disabled = true; }
      else {
        if (ds === selectedDate) btn.classList.add('selected');
        if (ds === todayStr) btn.classList.add('today');
        btn.onclick = () => selectDate(ds);
      }
      grid.appendChild(btn);
    }
  }

  function isAvailableDay(ds) {
    const [y, mo, d] = ds.split('-').map(Number);
    const dow = new Date(y, mo-1, d).getDay();
    if (!config.schedules) return true;
    const sched = config.schedules.find(s => s.day_of_week === dow && s.active);
    const maxDate = new Date(); maxDate.setDate(maxDate.getDate() + config.maxAdvanceDays);
    if (ds > maxDate.toLocaleDateString('sv-SE')) return false;
    return !!sched;
  }

  function changeMonth(dir) {
    calMonth += dir;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    if (calMonth < 0)  { calMonth = 11; calYear--; }
    renderCalendar();
  }

  async function selectDate(ds) {
    selectedDate = ds;
    selectedSlot = null;
    renderCalendar();
    goStep(2);
    await loadSlots(ds);
  }

  /* ── Slots ── */
  async function loadSlots(date) {
    const grid = document.getElementById('slots-grid');
    const label = document.getElementById('slots-date-label');
    if (!grid) return;
    grid.innerHTML = '<div class="no-slots">Načítavam termíny...</div>';

    const [y, mo, d] = date.split('-').map(Number);
    if (label) label.textContent = `Dostupné časy — ${d}. ${MONTH_NAMES_SK[mo-1]} ${y}`;

    if (!slots[date]) {
      try {
        const r = await fetch(`${BASE}/api/booking/${widgetId}/public/slots?date=${date}`);
        slots[date] = r.ok ? await r.json() : [];
      } catch { slots[date] = []; }
    }

    renderSlots(date);
  }

  function renderSlots(date) {
    const grid = document.getElementById('slots-grid');
    if (!grid) return;
    const list = slots[date] || [];
    if (!list.length) { grid.innerHTML = '<div class="no-slots">Žiadne voľné termíny pre tento deň.</div>'; return; }

    grid.innerHTML = '';
    list.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'slot-btn' + (selectedSlot === s.start_time ? ' selected' : '');
      btn.textContent = s.start_time;
      btn.onclick = () => {
        selectedSlot = s.start_time;
        grid.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('btn-to-step3').disabled = false;
      };
      grid.appendChild(btn);
    });
    document.getElementById('btn-to-step3').disabled = !selectedSlot;
  }

  /* ── Steps ── */
  window.goStep = function (n) {
    [1, 2, 3].forEach(i => {
      document.getElementById(`step-${i}`).className = 'step' + (i < n ? ' done' : i === n ? ' active' : '');
      document.getElementById(`panel-${i}`).className = 'step-panel' + (i === n ? ' active' : '');
    });
    document.getElementById('panel-success').className = 'step-panel';
    if (n === 3) renderSummary();
  };

  function renderSummary() {
    const [y, mo, d] = selectedDate.split('-').map(Number);
    const dateStr = `${d}. ${MONTH_NAMES_SK[mo-1]} ${y}`;
    const slot = (slots[selectedDate] || []).find(s => s.start_time === selectedSlot);
    document.getElementById('summary-box').innerHTML = `
      <div class="row"><span>📅 Dátum</span><span>${dateStr}</span></div>
      <div class="row"><span>🕐 Čas</span><span>${selectedSlot}${slot ? ' – ' + slot.end_time : ''}</span></div>
    `;
  }

  /* ── Submit ── */
  window.submitBooking = async function () {
    const name  = document.getElementById('f-name').value.trim();
    const email = document.getElementById('f-email').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const gdpr  = document.getElementById('f-gdpr').checked;

    let ok = true;
    ['f-name','f-email'].forEach(id => {
      const el = document.getElementById(id);
      if (!el.value.trim()) { el.classList.add('error'); ok = false; }
      else el.classList.remove('error');
    });
    if (!gdpr) { alert('Prosím, súhlaste so spracovaním osobných údajov.'); return; }
    if (!ok) return;

    const btn = document.getElementById('btn-submit');
    btn.disabled = true; btn.textContent = 'Odosielam...';

    try {
      const r = await fetch(`${BASE}/api/booking/${widgetId}/public/book`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerName: name, customerEmail: email, customerPhone: phone || undefined,
                               date: selectedDate, startTime: selectedSlot }),
      });
      const data = await r.json();
      if (!r.ok) { alert(data.error || 'Chyba rezervácie.'); btn.disabled = false; btn.textContent = 'Potvrdiť rezerváciu'; return; }

      // Show success
      [1,2,3].forEach(i => {
        document.getElementById(`step-${i}`).className = 'step done';
        document.getElementById(`panel-${i}`).className = 'step-panel';
      });
      document.getElementById('panel-success').className = 'step-panel active';
      const [y, mo, d] = selectedDate.split('-').map(Number);
      document.getElementById('success-msg').innerHTML =
        `<strong>${d}. ${MONTH_NAMES_SK[mo-1]} ${y}</strong> o <strong>${selectedSlot}</strong><br><br>` +
        esc(data.confirmationMessage || 'Tešíme sa na vás!') +
        `<br><br>Potvrdzovací email bol odoslaný na <strong>${esc(email)}</strong>.`;
    } catch {
      alert('Chyba pripojenia. Skúste to znova.');
      btn.disabled = false; btn.textContent = 'Potvrdiť rezerváciu';
    }
  };

  /* ── Utils ── */
  function pad(n) { return String(n).padStart(2, '0'); }
  function todayStr_() { return new Date().toLocaleDateString('sv-SE'); }
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function showError(msg) {
    document.getElementById('app').innerHTML =
      `<div class="card" style="text-align:center;padding:3rem 1rem;color:#64748b">${msg}</div>`;
  }

  init();
})();
</script>
</body>
</html>
