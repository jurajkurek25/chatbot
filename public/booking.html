<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezervácia termínu</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --p: #5b4fff; --p-light: rgba(91,79,255,0.09); --p-dark: #4338e0;
      --grad2: #9b8cff;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --text: #1e293b; --muted: #64748b; --border: #e2e8f0;
      --bg: #f1f5f9; --card: #ffffff; --radius: 16px; --btn-radius: 10px;
    }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font);
           background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Layout ── */
    .page { max-width: 720px; margin: 0 auto; padding: 0 1rem 4rem; }

    /* ── Header ── */
    .bk-header {
      background: linear-gradient(135deg, var(--p) 0%, var(--grad2, #9b8cff) 100%);
      color: white; text-align: center; padding: 2rem 1.5rem 3.5rem;
      border-radius: 0 0 28px 28px; margin-bottom: -1.5rem; position: relative;
    }
    .bk-avatar { width: 64px; height: 64px; border-radius: 50%;
                 background: rgba(255,255,255,0.25); border: 3px solid rgba(255,255,255,0.6);
                 display: flex; align-items: center; justify-content: center;
                 font-size: 1.8rem; margin: 0 auto 0.75rem; }
    .bk-header h1 { font-size: 1.3rem; font-weight: 800; margin-bottom: 0.25rem; }
    .bk-header p  { font-size: 0.85rem; opacity: 0.85; }

    /* ── Step indicator ── */
    .steps-bar {
      display: flex; align-items: center; justify-content: center;
      gap: 0; margin: 1.5rem 0 0; padding: 0 1rem;
    }
    .step-dot {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      flex: 1; position: relative;
    }
    .step-dot::before {
      content: ''; position: absolute; top: 14px; right: -50%;
      height: 2px; width: 100%; background: var(--border); z-index: 0;
    }
    .step-dot:last-child::before { display: none; }
    .step-dot .dot {
      width: 28px; height: 28px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700;
      background: var(--border); color: var(--muted); z-index: 1; position: relative;
      transition: background 0.2s, color 0.2s;
    }
    .step-dot.active .dot { background: var(--p); color: white; box-shadow: 0 0 0 4px var(--p-light); }
    .step-dot.done .dot   { background: #22c55e; color: white; }
    .step-dot .label { font-size: 0.65rem; font-weight: 600; color: var(--muted); text-align: center; white-space: nowrap; }
    .step-dot.active .label { color: var(--p); }

    /* ── Card ── */
    .card { background: var(--card); border-radius: var(--radius);
            box-shadow: 0 2px 20px rgba(0,0,0,0.06); padding: 1.5rem;
            margin-bottom: 1rem; position: relative; }
    .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 1rem; color: var(--text); }

    /* ── Panels ── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Service selection ── */
    .services-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media(max-width: 480px) { .services-grid { grid-template-columns: 1fr; } }
    .svc-card {
      border: 2px solid var(--border); border-radius: 12px; padding: 1rem;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
      background: white;
    }
    .svc-card:hover { border-color: var(--p); background: var(--p-light); }
    .svc-card.selected { border-color: var(--p); background: var(--p-light); }
    .svc-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.25rem; }
    .svc-desc { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.5rem; line-height: 1.4; }
    .svc-meta { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .svc-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 0.72rem; font-weight: 600; padding: 2px 8px;
      border-radius: 100px; background: var(--bg); color: var(--muted);
    }
    .svc-card.selected .svc-badge { background: rgba(91,79,255,0.12); color: var(--p); }

    /* ── Calendar ── */
    .cal-nav-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .cal-nav-row h2 { font-size: 0.95rem; font-weight: 700; }
    .cal-btn { background: none; border: 1.5px solid var(--border); border-radius: 8px;
               width: 32px; height: 32px; cursor: pointer; display: flex;
               align-items: center; justify-content: center; font-size: 1rem;
               color: var(--text); transition: background 0.15s; }
    .cal-btn:hover { background: var(--p-light); border-color: var(--p); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-day-name { text-align: center; font-size: 0.68rem; font-weight: 700;
                    color: var(--muted); padding: 0.4rem 0; }
    .cal-day {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; font-size: 0.82rem; cursor: pointer; border: none;
      background: none; font-family: inherit; font-weight: 500;
      transition: background 0.15s, color 0.15s; position: relative;
    }
    .cal-day:disabled { color: #cbd5e1; cursor: not-allowed; }
    .cal-day:not(:disabled):hover { background: var(--p-light); color: var(--p); font-weight: 700; }
    .cal-day.today { font-weight: 800; color: var(--p); }
    .cal-day.today::after { content: ''; position: absolute; bottom: 3px; left: 50%;
                            transform: translateX(-50%); width: 4px; height: 4px;
                            background: var(--p); border-radius: 50%; }
    .cal-day.selected { background: var(--p) !important; color: white !important; font-weight: 700; }
    .cal-day.has-slots::before { content: ''; position: absolute; top: 3px; right: 4px;
                                  width: 5px; height: 5px; background: #22c55e; border-radius: 50%; }

    /* ── Time slots ── */
    .date-label { font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 0.75rem; }
    .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 8px; }
    .slot-btn {
      padding: 0.55rem 0.25rem; border: 1.5px solid var(--border); border-radius: var(--btn-radius, 9px);
      background: white; font-size: 0.84rem; font-weight: 600; cursor: pointer;
      font-family: inherit; color: var(--text); transition: all 0.15s; text-align: center;
    }
    .slot-btn:hover { border-color: var(--p); background: var(--p-light); color: var(--p); }
    .slot-btn.selected { border-color: var(--p); background: var(--p); color: white; }
    .no-slots { color: var(--muted); font-size: 0.875rem; padding: 1.5rem 0; text-align: center; }

    /* ── Contact form ── */
    .summary-box {
      background: var(--p-light); border: 1.5px solid rgba(91,79,255,0.18);
      border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1.25rem;
    }
    .summary-row { display: flex; justify-content: space-between; align-items: center;
                   padding: 0.25rem 0; font-size: 0.875rem; }
    .summary-row span:first-child { color: var(--muted); }
    .summary-row span:last-child  { font-weight: 700; color: var(--p); }
    .form-group { margin-bottom: 0.875rem; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 700;
                        color: var(--muted); margin-bottom: 0.3rem; }
    .form-group input { width: 100%; padding: 0.65rem 0.9rem; border: 1.5px solid var(--border);
                        border-radius: 9px; font-size: 0.9rem; font-family: inherit;
                        outline: none; color: var(--text); transition: border-color 0.2s; }
    .form-group input:focus { border-color: var(--p); }
    .form-group input.err { border-color: #dc2626; }
    .gdpr-row { display: flex; gap: 0.6rem; align-items: flex-start; margin-top: 0.5rem; }
    .gdpr-row input[type=checkbox] { margin-top: 3px; width: 16px; height: 16px;
                                      flex-shrink: 0; accent-color: var(--p); }
    .gdpr-row label { font-size: 0.76rem; color: var(--muted); font-weight: 400; }

    /* ── Buttons ── */
    .btn-row { display: flex; gap: 0.75rem; margin-top: 1.25rem; }
    .btn {
      padding: 0.75rem 1.25rem; border-radius: var(--btn-radius, 10px); border: none; font-size: 0.9rem;
      font-weight: 700; cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .btn-back { background: var(--bg); color: var(--muted); flex-shrink: 0; }
    .btn-back:hover { background: var(--border); }
    .btn-next { background: var(--p); color: white; flex: 1;
                box-shadow: 0 4px 14px rgba(91,79,255,0.3); }
    .btn-next:hover { background: var(--p-dark); transform: translateY(-1px); }
    .btn-next:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* ── Success ── */
    .success-screen { text-align: center; padding: 2.5rem 1rem; }
    .success-icon { font-size: 3.5rem; margin-bottom: 1rem; }
    .success-screen h2 { font-size: 1.3rem; font-weight: 800; color: #15803d; margin-bottom: 0.5rem; }
    .success-screen p { color: var(--muted); font-size: 0.9rem; line-height: 1.65; }

    /* ── Loading ── */
    .loading-wrap { display: flex; flex-direction: column; align-items: center;
                    justify-content: center; padding: 4rem 0; gap: 1rem; color: var(--muted); font-size: 0.875rem; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border);
               border-top-color: var(--p); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-card { text-align: center; padding: 3rem 1.5rem; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
<div class="page">
  <div id="app">
    <div class="loading-wrap"><div class="spinner"></div>Načítavam...</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const widgetId = location.pathname.split('/').filter(Boolean).pop();
  const BASE = location.origin;
  let cfg = null;
  let selService = null; // { id, name, duration_mins, price, currency }
  let selDate    = null;
  let selSlot    = null;
  let slotsCache = {};
  let calY, calM;

  const MONTHS = ['Január','Február','Marec','Apríl','Máj','Jún',
                  'Júl','August','September','Október','November','December'];
  const DAYS   = ['Ne','Po','Ut','St','Št','Pi','So'];

  /* ── Init ── */
  async function init() {
    try {
      const r = await fetch(`${BASE}/api/booking/${widgetId}/public/config`);
      if (!r.ok) { showError('Rezervácie nie sú pre túto stránku k dispozícii.'); return; }
      cfg = await r.json();
      document.title = `Rezervácia – ${cfg.botName}`;
      applyColors(cfg.primaryColor || '#5b4fff');
      if (cfg.designConfig) applyDesign(cfg.designConfig);
      const now = new Date();
      calY = now.getFullYear(); calM = now.getMonth();
      renderApp();
    } catch { showError('Chyba pri načítaní. Skúste obnoviť stránku.'); }
  }

  function applyDesign(d) {
    if (!d) return;
    if (d.primaryColor) applyColors(d.primaryColor);
    if (d.bgColor) document.documentElement.style.setProperty('--bg', d.bgColor);
    if (d.headerGradientColor) document.documentElement.style.setProperty('--grad2', d.headerGradientColor);
    if (d.borderRadius != null) {
      document.documentElement.style.setProperty('--radius', d.borderRadius + 'px');
      document.documentElement.style.setProperty('--btn-radius', Math.max(4, d.borderRadius - 4) + 'px');
    }
    if (d.avatarEmoji) window._bkAvatarEmoji = d.avatarEmoji;
    if (d.fontFamily && d.fontFamily !== 'system') {
      const fontMap = { inter: 'Inter', poppins: 'Poppins', lato: 'Lato',
                        roboto: 'Roboto', montserrat: 'Montserrat', merriweather: 'Merriweather' };
      const fn = fontMap[d.fontFamily];
      if (fn) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(fn)}:wght@400;600;700;800&display=swap`;
        document.head.appendChild(link);
        document.documentElement.style.setProperty('--font', `'${fn}', sans-serif`);
      }
    }
  }

  function applyColors(hex) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    document.documentElement.style.setProperty('--p', hex);
    document.documentElement.style.setProperty('--p-dark', darken(r,g,b));
    document.documentElement.style.setProperty('--p-light', `rgba(${r},${g},${b},0.09)`);
  }
  function darken(r,g,b) {
    return `rgb(${Math.max(0,r-30)},${Math.max(0,g-30)},${Math.max(0,b-30)})`;
  }

  /* ── Determine starting step ── */
  function firstStep() { return cfg.services && cfg.services.length > 0 ? 0 : 1; }
  let step = null; // set after cfg loaded

  /* ── Render ── */
  function renderApp() {
    step = firstStep();
    const hasServices = cfg.services && cfg.services.length > 0;
    const steps = hasServices
      ? [{ label: 'Služba' }, { label: 'Dátum' }, { label: 'Čas' }, { label: 'Kontakt' }]
      : [{ label: 'Dátum' }, { label: 'Čas' }, { label: 'Kontakt' }];

    document.getElementById('app').innerHTML = `
      <div class="bk-header">
        <div class="bk-avatar">${window._bkAvatarEmoji || '📅'}</div>
        <h1>${esc(cfg.botName)}</h1>
        <p>Vyberte si termín online</p>
        <div class="steps-bar" id="steps-bar"></div>
      </div>

      <div class="card" style="margin-top:2rem">
        <div class="panel" id="p-service"></div>
        <div class="panel" id="p-date"></div>
        <div class="panel" id="p-time"></div>
        <div class="panel" id="p-contact"></div>
        <div class="panel" id="p-success"></div>
      </div>
    `;
    renderSteps();
    showStep(step);
  }

  function renderSteps() {
    const hasServices = cfg.services && cfg.services.length > 0;
    const labels = hasServices
      ? ['Služba','Dátum','Čas','Kontakt']
      : ['Dátum','Čas','Kontakt'];
    const bar = document.getElementById('steps-bar');
    if (!bar) return;
    const stepOffset = hasServices ? 0 : -1; // adjust index
    bar.innerHTML = labels.map((l, i) => {
      const realStep = hasServices ? i : i + 1;
      const cls = realStep < step ? 'done' : realStep === step ? 'active' : '';
      const num = realStep < step ? '✓' : (i + 1);
      return `<div class="step-dot ${cls}"><div class="dot">${num}</div><div class="label">${l}</div></div>`;
    }).join('');
  }

  function showStep(s) {
    step = s;
    renderSteps();
    const ids = ['p-service','p-date','p-time','p-contact','p-success'];
    ids.forEach(id => document.getElementById(id)?.classList.remove('active'));

    if (s === 0) { renderServicePanel(); document.getElementById('p-service').classList.add('active'); }
    else if (s === 1) { renderDatePanel(); document.getElementById('p-date').classList.add('active'); }
    else if (s === 2) { renderTimePanel(); document.getElementById('p-time').classList.add('active'); }
    else if (s === 3) { renderContactPanel(); document.getElementById('p-contact').classList.add('active'); }
    else if (s === 99) { document.getElementById('p-success').classList.add('active'); }
  }
  window.showStep = showStep;

  /* ── Step 0: Service selection ── */
  function renderServicePanel() {
    const el = document.getElementById('p-service');
    if (!el) return;
    el.innerHTML = `<div class="card-title">Vyberte službu</div>
      <div class="services-grid">
        ${cfg.services.map((s, i) => {
          const price = s.price != null ? `${s.price} ${s.currency}` : 'Zadarmo';
          const sel   = selService?.id === s.id ? ' selected' : '';
          return `<div class="svc-card${sel}" onclick="selectService(${i})">
            <div class="svc-name">${esc(s.name)}</div>
            ${s.description ? `<div class="svc-desc">${esc(s.description)}</div>` : ''}
            <div class="svc-meta">
              <span class="svc-badge">⏱ ${s.duration_mins} min</span>
              <span class="svc-badge">💶 ${esc(price)}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="btn-row" style="margin-top:1.25rem">
        <button class="btn btn-next" id="btn-svc-next" onclick="showStep(1)" ${selService?'':'disabled'}>
          Pokračovať →
        </button>
      </div>`;
  }

  window.selectService = function(idx) {
    selService = cfg.services[idx];
    if (!selService) return;
    selDate = null; selSlot = null; slotsCache = {};
    document.querySelectorAll('.svc-card').forEach((c, i) => {
      c.classList.toggle('selected', i === idx);
    });
    const btn = document.getElementById('btn-svc-next');
    if (btn) btn.disabled = false;
  };

  /* ── Step 1: Date picker ── */
  function renderDatePanel() {
    const el = document.getElementById('p-date');
    if (!el) return;
    el.innerHTML = `
      <div class="card-title">Vyberte dátum</div>
      <div class="cal-nav-row">
        <button class="cal-btn" id="cal-prev">‹</button>
        <h2 id="cal-title"></h2>
        <button class="cal-btn" id="cal-next">›</button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="btn-row" style="margin-top:1rem">
        ${firstStep()===0 ? '<button class="btn btn-back" onclick="showStep(0)">← Späť</button>' : ''}
        <button class="btn btn-next" id="btn-date-next" onclick="showStep(2)" disabled>Pokračovať →</button>
      </div>`;
    document.getElementById('cal-prev').onclick = () => { calM--; if(calM<0){calM=11;calY--;} renderCal(); };
    document.getElementById('cal-next').onclick = () => { calM++; if(calM>11){calM=0;calY++;} renderCal(); };
    renderCal();
  }

  function renderCal() {
    const title = document.getElementById('cal-title');
    const grid  = document.getElementById('cal-grid');
    if (!title || !grid) return;
    title.textContent = `${MONTHS[calM]} ${calY}`;
    grid.innerHTML = '';
    DAYS.forEach(d => {
      const el = document.createElement('div'); el.className = 'cal-day-name'; el.textContent = d;
      grid.appendChild(el);
    });
    const today = todayStr();
    const firstDay = new Date(calY, calM, 1).getDay();
    const daysInMonth = new Date(calY, calM + 1, 0).getDate();
    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div'); grid.appendChild(el);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = `${calY}-${pad(calM+1)}-${pad(d)}`;
      const btn = document.createElement('button'); btn.className = 'cal-day'; btn.textContent = d;
      if (ds === today) btn.classList.add('today');
      if (ds === selDate) btn.classList.add('selected');
      if (ds < today || !isAvailDay(ds)) { btn.disabled = true; }
      else {
        btn.onclick = () => {
          selDate = ds; selSlot = null;
          document.querySelectorAll('.cal-day').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          const nb = document.getElementById('btn-date-next');
          if (nb) nb.disabled = false;
        };
      }
      grid.appendChild(btn);
    }
  }

  function isAvailDay(ds) {
    if (!cfg.schedules) return true;
    const [y,mo,d] = ds.split('-').map(Number);
    const dow = new Date(y,mo-1,d).getDay();
    const sched = cfg.schedules.find(s => s.day_of_week === dow && s.active);
    const max = new Date(); max.setDate(max.getDate() + (cfg.maxAdvanceDays || 60));
    if (ds > max.toLocaleDateString('sv-SE')) return false;
    return !!sched;
  }

  /* ── Step 2: Time slots ── */
  function renderTimePanel() {
    const el = document.getElementById('p-time');
    if (!el) return;
    const [y,mo,d] = selDate.split('-').map(Number);
    const dateLabel = `${d}. ${MONTHS[mo-1]} ${y}`;
    el.innerHTML = `
      <div class="card-title">Vyberte čas</div>
      <div class="date-label">📅 ${dateLabel}${selService ? ` · ${esc(selService.name)}` : ''}</div>
      <div id="slots-wrap"><div class="no-slots">Načítavam...</div></div>
      <div class="btn-row" style="margin-top:1rem">
        <button class="btn btn-back" onclick="showStep(1)">← Späť</button>
        <button class="btn btn-next" id="btn-time-next" onclick="showStep(3)" disabled>Pokračovať →</button>
      </div>`;
    loadSlots(selDate);
  }

  async function loadSlots(date) {
    if (!slotsCache[date]) {
      let url = `${BASE}/api/booking/${widgetId}/public/slots?date=${date}`;
      if (selService) url += `&serviceId=${selService.id}`;
      try {
        const r = await fetch(url);
        slotsCache[date] = r.ok ? await r.json() : [];
      } catch { slotsCache[date] = []; }
    }
    renderSlots(date);
  }

  function renderSlots(date) {
    const wrap = document.getElementById('slots-wrap');
    if (!wrap) return;
    const list = slotsCache[date] || [];
    if (!list.length) { wrap.innerHTML = '<div class="no-slots">Žiadne voľné termíny pre tento deň.</div>'; return; }
    wrap.innerHTML = '<div class="slots-grid"></div>';
    const grid = wrap.querySelector('.slots-grid');
    list.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'slot-btn' + (selSlot === s.start_time ? ' selected' : '');
      btn.textContent = s.start_time;
      btn.onclick = () => {
        selSlot = s.start_time;
        grid.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        const nb = document.getElementById('btn-time-next');
        if (nb) nb.disabled = false;
      };
      grid.appendChild(btn);
    });
    const nb = document.getElementById('btn-time-next');
    if (nb) nb.disabled = !selSlot;
  }

  /* ── Step 3: Contact form ── */
  function renderContactPanel() {
    const el = document.getElementById('p-contact');
    if (!el) return;
    const [y,mo,d] = selDate.split('-').map(Number);
    const dateLabel = `${d}. ${MONTHS[mo-1]} ${y}`;
    const endTime = slotsCache[selDate]?.find(s => s.start_time === selSlot)?.end_time;

    el.innerHTML = `
      <div class="card-title">Vaše kontaktné údaje</div>
      <div class="summary-box">
        ${selService ? `<div class="summary-row"><span>✂️ Služba</span><span>${esc(selService.name)}</span></div>` : ''}
        <div class="summary-row"><span>📅 Dátum</span><span>${dateLabel}</span></div>
        <div class="summary-row"><span>🕐 Čas</span><span>${selSlot}${endTime ? ' – ' + endTime : ''}</span></div>
        ${selService?.price != null ? `<div class="summary-row"><span>💶 Cena</span><span>${selService.price} ${selService.currency}</span></div>` : ''}
      </div>
      <div class="form-group"><label>Meno a priezvisko *</label>
        <input type="text" id="f-name" placeholder="Ján Novák" autocomplete="name"></div>
      <div class="form-group"><label>Email *</label>
        <input type="email" id="f-email" placeholder="jan@email.sk" autocomplete="email"></div>
      <div class="form-group"><label>Telefón (nepovinné)</label>
        <input type="tel" id="f-phone" placeholder="+421 900 000 000" autocomplete="tel"></div>
      <div class="gdpr-row">
        <input type="checkbox" id="f-gdpr">
        <label for="f-gdpr">Súhlasím so spracovaním osobných údajov za účelom rezervácie termínu.*</label>
      </div>
      <div class="btn-row">
        <button class="btn btn-back" onclick="showStep(2)">← Späť</button>
        <button class="btn btn-next" id="btn-submit" onclick="submitBooking()">Potvrdiť rezerváciu</button>
      </div>`;
  }

  /* ── Submit ── */
  window.submitBooking = async function() {
    const name  = document.getElementById('f-name')?.value.trim();
    const email = document.getElementById('f-email')?.value.trim();
    const phone = document.getElementById('f-phone')?.value.trim();
    const gdpr  = document.getElementById('f-gdpr')?.checked;

    let valid = true;
    if (!name)  { document.getElementById('f-name')?.classList.add('err');  valid = false; }
    else          document.getElementById('f-name')?.classList.remove('err');
    if (!email) { document.getElementById('f-email')?.classList.add('err'); valid = false; }
    else          document.getElementById('f-email')?.classList.remove('err');
    if (!gdpr) { alert('Prosím, súhlaste so spracovaním osobných údajov.'); return; }
    if (!valid) return;

    const btn = document.getElementById('btn-submit');
    if (btn) { btn.disabled = true; btn.textContent = 'Odosielam...'; }

    try {
      const r = await fetch(`${BASE}/api/booking/${widgetId}/public/book`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customerName:  name,
          customerEmail: email,
          customerPhone: phone || undefined,
          date:          selDate,
          startTime:     selSlot,
          serviceId:     selService?.id || undefined,
          serviceName:   selService?.name || undefined,
        }),
      });
      const data = await r.json();
      if (!r.ok) {
        alert(data.error || 'Chyba rezervácie.');
        if (btn) { btn.disabled = false; btn.textContent = 'Potvrdiť rezerváciu'; }
        return;
      }
      renderSuccess(name, email, data);
    } catch {
      alert('Chyba pripojenia. Skúste znova.');
      if (btn) { btn.disabled = false; btn.textContent = 'Potvrdiť rezerváciu'; }
    }
  };

  function renderSuccess(name, email, data) {
    showStep(99);
    const [y,mo,d] = selDate.split('-').map(Number);
    const dateLabel = `${d}. ${MONTHS[mo-1]} ${y}`;
    const el = document.getElementById('p-success');
    if (!el) return;
    el.innerHTML = `
      <div class="success-screen">
        <div class="success-icon">✅</div>
        <h2>Rezervácia potvrdená!</h2>
        ${selService ? `<p style="font-size:1rem;font-weight:700;color:var(--p);margin:0.5rem 0">${esc(selService.name)}</p>` : ''}
        <p style="font-size:1rem;font-weight:700;margin:0.4rem 0">${dateLabel} o ${selSlot}</p>
        <p style="margin-top:0.75rem">${esc(data.confirmationMessage || 'Tešíme sa na vás!')}</p>
        <p style="margin-top:0.75rem">Potvrdzovací email bol odoslaný na <strong>${esc(email)}</strong>.</p>
        <p style="margin-top:1.5rem;font-size:0.8rem;color:#94a3b8">Môžete zavrieť toto okno.</p>
      </div>`;
  }

  /* ── Utils ── */
  function pad(n) { return String(n).padStart(2,'0'); }
  function todayStr() { return new Date().toLocaleDateString('sv-SE'); }
  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function showError(msg) {
    document.getElementById('app').innerHTML = `
      <div class="card" style="margin-top:2rem">
        <div class="error-card">⚠️<br><br>${msg}</div>
      </div>`;
  }

  init();
})();
</script>
</body>
</html>
